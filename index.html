<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha página de notícias</title>

  <style>
    header {
      background-color: #25376e;
      color: #FFFFFF;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      border: 5px solid #000;
    }

    main {
      background-color: #FFFFFF;
      color: #25376e;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      gap: 20px;
    }

    img {
      width: 80px;
      height: 80px;
      object-fit: cover;
    }

    .escritor-da-noticia {
      font-weight: bold;
    }

    button {
      cursor: pointer;
      margin-right: 8px;
      padding: 5px 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Minha página é uma página de notícias</h1>
    <p>Aqui irei compartilhar notícias para espalhar informação</p>
  </header>

  <main>

    <article>
      <img
        src="Gemini_Generated_Image_rons5nrons5nrons.png"
        alt="Logo em azul-escuro com a sigla BR em verde e o subtítulo Jornalismo e Atualização"
      >
    </article>

    <div>
      <h2>Primeira notícia</h2>

      <p class="escritor-da-noticia">Por: Kamily Maia</p>

      <p>
        Boas-vindas, caros leitores! Aqui irei publicar notícias
        fresquinhas do dia a dia para manter você atualizado.
      </p>

      <button>🤔 <span>0</span></button>
      <button>🕵️‍♀️ <span>0</span></button>
    </div>

  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function(botao) {
      let curtiu = false;

      botao.addEventListener("click", function() {
        let texto = botao.querySelector("span");

        if (curtiu === false) {
          texto.textContent++;
          curtiu = true;
        }
      });
    });
  </script>

</body>
</html>
